[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-week01-tool-calling-lab"
version = "0.1.0"
description = "Week 01 learning lab for building a tool-calling study agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=2,<3", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]

[tool.setuptools.packages.find]
include = ["study_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

